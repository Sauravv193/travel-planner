# Production-safe overrides. Keep operational diagnostics without exposing secrets.
logging.level.com.travelplanner=INFO
logging.level.org.springframework.web=WARN

# Never fall back to the development JWT signing secret in production.
travel.app.jwtSecret=${JWT_SECRET}

# Never expose environment variables, heap dumps, thread dumps, or logger controls over HTTP.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
